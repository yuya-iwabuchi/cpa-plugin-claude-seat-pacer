# Keeps the pinned action SHAs and the Go module requirements current. Monthly,
# with every action update in one pull request, so the pins stay fresh without
# a stream of single-bump pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
