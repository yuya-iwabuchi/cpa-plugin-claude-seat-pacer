# Cutting a release: tag a commit on main `v<version>`, where <version> is the
# pluginVersion in main.go, and push the tag. The package job refuses a tag that
# disagrees with pluginVersion, because the version is part of every asset's
# name and a mismatch ships an asset the store cannot find, and it refuses a
# tag on a commit main does not contain.
#
# The release carries one zip per platform beside a single checksums.txt
# covering all of them, which is the shape the plugin store reads, and a build
# provenance attestation for each zip. checksums.txt catches a corrupted
# download; the attestation shows a zip was built by this workflow from this
# repository, which a checksum published beside the zip cannot.
#
# A pull request that touches the release path, and a run started by hand, is
# a dry run: it builds and assembles every platform and publishes nothing, so a
# change to the release path is exercised before it merges.
#
# Write permission lives on the publish job alone. Actions are pinned to commit
# SHAs, checkouts keep no credentials, and builds start from an empty cache.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - Makefile
      - go.mod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: so, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, ext: so, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, ext: dylib, runner: macos-latest}
          - {goos: darwin, goarch: amd64, ext: dylib, runner: macos-15-intel}
          - {goos: windows, goarch: amd64, ext: dll, runner: windows-latest}
    steps:
      # Full history, so the tagged commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: read the version, and check the tag against it and against main
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*pluginVersion = "\(.*\)".*/\1/p' main.go)
          test -n "$version" || { echo "pluginVersion not found in main.go"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME disagrees with pluginVersion $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which main does not contain"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # cgo cannot cross-compile here, so each platform builds natively and
      # GOOS/GOARCH stay unset. The packager writes the zip and its sha256 line.
      - name: build and package
        shell: bash
        run: |
          library="dist/claude-seat-pacer.${{ matrix.ext }}"
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o "$library" .
          go run ./.github/scripts/package.go -lib "$library" \
            -out "release/claude-seat-pacer_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/
          if-no-files-found: error

  assemble:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: staging
      # One checksums.txt lists every platform's zip; the store verifies only
      # the line matching the archive it selected.
      - name: assemble the release directory
        shell: bash
        run: |
          mkdir -p release
          find staging -name '*.zip' -exec mv {} release/ \;
          find staging -name '*.sha256' | sort | xargs cat > release/checksums.txt
          test "$(find release -name '*.zip' | wc -l)" -eq 5
          test "$(wc -l < release/checksums.txt)" -eq 5
          (cd release && sha256sum --check --strict checksums.txt)
          ls -l release && cat release/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      # The store installs from /releases/latest, which GitHub excludes
      # prereleases from, so this publishes outright.
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag release/*
