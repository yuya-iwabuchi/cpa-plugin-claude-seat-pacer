# The gate every change passes. `check` runs the whole suite — gofmt, vet, the
# race detector and the shared library — on the two platforms the plugin is
# developed on. `crossbuild` proves the library still links on every platform a
# release ships to, without paying for the race detector five times. The
# vulnerability scan is vuln.yml, which also runs on a schedule.
#
# Actions are pinned to commit SHAs, with the release they came from beside
# each; Dependabot proposes updates. Checkouts keep no credentials, and every
# job has a timeout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The macOS library records the oldest macOS it loads on. Left unset, that is
# the runner's own SDK version, which shuts out every older release; 12.0 is
# the oldest Go 1.25 supports.
env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. A run on
# main is never cancelled once it starts; one still queued gives way to a newer
# push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  crossbuild:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: so, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, ext: so, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, ext: dylib, runner: macos-latest}
          - {goos: darwin, goarch: amd64, ext: dylib, runner: macos-15-intel}
          - {goos: windows, goarch: amd64, ext: dll, runner: windows-latest}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # darwin/amd64 builds with the patched toolchain the release uses,
      # cached under the Go version, the patch and the script that built it.
      - name: read the pinned Go version
        id: go
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        shell: bash
        run: echo "version=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        with:
          path: ${{ runner.temp }}/go-tls/go
          key: go-tls-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('.github/scripts/go-tls-slot.patch', '.github/scripts/build-darwin-amd64.sh') }}
      # -buildmode=c-shared needs cgo, and cgo has no cross toolchain here, so
      # every target builds on a runner of its own architecture. GOOS and
      # GOARCH stay unset for that reason: the native default is the target.
      - name: build
        shell: bash
        run: |
          library="dist/claude-seat-pacer.${{ matrix.ext }}"
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = darwin/amd64 ]; then
            .github/scripts/build-darwin-amd64.sh "$library"
          else
            CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o "$library" .
          fi
